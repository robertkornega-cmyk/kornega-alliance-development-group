<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-section input {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            width: 300px;
            max-width: 100%;
        }

        .search-section button {
            padding: 12px 25px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-section button:hover {
            background: #ff5252;
        }

        .search-section button:active {
            transform: scale(0.98);
        }

        .main-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .weather-icon {
            font-size: 80px;
            margin: 20px 0;
        }

        .city-name {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 3.5rem;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        .weather-description {
            font-size: 1.3rem;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
        }

        .forecast-day {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 40px;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.2rem;
            color: #333;
            margin: 10px 0;
        }

        .forecast-temp-range {
            font-size: 0.9rem;
            color: #999;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forecast-section h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .temperature {
                font-size: 2.5rem;
            }

            .search-section input {
                width: 100%;
            }

            .main-weather {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information for any city</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name (e.g., London, New York, Tokyo)" 
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="searchWeather()">Search</button>
            <button onclick="getLocationWeather()" title="Get weather for your location">📍 My Location</button>
        </div>

        <div id="errorContainer"></div>

        <div id="weatherContainer">
            <div class="loading">
                <p>Enter a city name to get started</p>
            </div>
        </div>

        <div id="forecastSection"></div>
    </div>

    <script>
        const API_KEY = 'b6fd43b522585c892fa343f025dab60a'; // OpenWeatherMap free API key
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        function showLoading() {
            document.getElementById('weatherContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `
                <div class="error">${message}</div>
            `;
            document.getElementById('weatherContainer').innerHTML = '';
            document.getElementById('forecastSection').innerHTML = '';
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        function getWeatherIcon(iconCode) {
            const iconMap = {
                '01d': '☀️', '01n': '🌙',
                '02d': '⛅', '02n': '🌥️',
                '03d': '☁️', '03n': '☁️',
                '04d': '☁️', '04n': '☁️',
                '09d': '🌧️', '09n': '🌧️',
                '10d': '🌦️', '10n': '🌧️',
                '11d': '⛈️', '11n': '⛈️',
                '13d': '❄️', '13n': '❄️',
                '50d': '🌫️', '50n': '🌫️'
            };
            return iconMap[iconCode] || '🌡️';
        }

        function displayWeather(data) {
            clearError();
            const { main, weather, wind, clouds, sys, name, coord } = data;
            const icon = getWeatherIcon(weather[0].icon);
            
            const htmlContent = `
                <div class="main-weather">
                    <div class="city-name">${name}, ${data.sys.country}</div>
                    <div class="weather-icon">${icon}</div>
                    <div class="temperature">${Math.round(main.temp)}°C</div>
                    <div class="weather-description">${weather[0].description}</div>
                    
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Feels Like</div>
                            <div class="detail-value">${Math.round(main.feels_like)}°C</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${main.humidity}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Pressure</div>
                            <div class="detail-value">${main.pressure} mb</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind Speed</div>
                            <div class="detail-value">${wind.speed} m/s</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Cloudiness</div>
                            <div class="detail-value">${clouds.all}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Visibility</div>
                            <div class="detail-value">${(data.visibility / 1000).toFixed(1)} km</div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('weatherContainer').innerHTML = htmlContent;
            
            // Fetch forecast
            fetchForecast(data.name);
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading();
            
            fetch(`${BASE_URL}/weather?q=${city}&units=metric&appid=${API_KEY}`)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('City not found. Please check the spelling and try again.');
                        }
                        throw new Error('Failed to fetch weather data');
                    }
                    return response.json();
                })
                .then(data => displayWeather(data))
                .catch(error => showError(error.message));
        }

        function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }

            showLoading();
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    fetch(`${BASE_URL}/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=${API_KEY}`)
                        .then(response => response.json())
                        .then(data => displayWeather(data))
                        .catch(error => showError('Failed to fetch weather for your location'));
                },
                (error) => {
                    showError('Unable to get your location. Please enable location access.');
                }
            );
        }

        function fetchForecast(city) {
            fetch(`${BASE_URL}/forecast?q=${city}&units=metric&appid=${API_KEY}`)
                .then(response => response.json())
                .then(data => displayForecast(data))
                .catch(error => console.log('Forecast not available'));
        }

        function displayForecast(data) {
            const forecasts = {};
            
            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                if (!forecasts[day]) {
                    forecasts[day] = item;
                }
            });

            const forecastHTML = `
                <h2>5-Day Forecast</h2>
                <div class="forecast">
                    ${Object.entries(forecasts).slice(0, 5).map(([day, item]) => `
                        <div class="forecast-card">
                            <div class="forecast-day">${day}</div>
                            <div class="forecast-icon">${getWeatherIcon(item.weather[0].icon)}</div>
                            <div class="forecast-temp">${Math.round(item.main.temp)}°C</div>
                            <div class="forecast-temp-range">
                                H: ${Math.round(item.main.temp_max)}° L: ${Math.round(item.main.temp_min)}°
                            </div>
                            <div style="font-size: 0.85rem; color: #666; text-transform: capitalize;">
                                ${item.weather[0].description}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('forecastSection').innerHTML = forecastHTML;
        }

        // Load default city on page load
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'London';
            searchWeather();
        });
    </script>
</body>
</html>
